<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mood Swings Deck Generator</title><link rel="icon" href="data:,"><link rel="stylesheet" href="css/main.css"></head>
<body><div id="appToast" class="app-toast" role="status" aria-live="polite"></div><div class=wrap>
<div class=row style="justify-content:space-between"><div><h1 id=tTitle>Mood Swings — Generador de Mazos</h1><nav class="app-section-nav" aria-label="Main sections">
<button type="button" class="section-nav-btn active" data-section-target="generator"><span class="nav-icon">⚙</span> <span class="nav-label" data-nav-en="Generator" data-nav-es="Generador">Generator</span></button>
<button type="button" class="section-nav-btn" data-section-target="decks"><span class="nav-icon">▦</span> <span class="nav-label" data-nav-en="Decks" data-nav-es="Mazos">Decks</span></button>
<button type="button" class="section-nav-btn" data-section-target="collection"><span class="nav-icon">◫</span> <span class="nav-label" data-nav-en="Collection" data-nav-es="Colección">Collection</span></button>
<button type="button" class="section-nav-btn" data-section-target="history"><span class="nav-icon">◷</span> <span class="nav-label" data-nav-en="History" data-nav-es="Historial">History</span></button>
</nav><p id=tSub class=small></p></div><div class="lang-picker">
<button type="button" id="langButton" class="lang-button secondary" onclick="toggleLangMenu()"></button>
<div id="langMenu" class="lang-menu" style="display:none">
<button type="button" onclick="setLang('es');closeLangMenu()"><span class="flag-svg flag-es"></span><span>Español</span></button>
<button type="button" onclick="setLang('en');closeLangMenu()"><span class="flag-svg flag-gb"></span><span>English</span></button>
</div></div></div>
<div id="section-generator" class="section-anchor"></div><div class="card deck-config-card"><h2 id=tConfig></h2>

<div class="config-section">
  <div class="config-section-title" data-en="General" data-es="General">General</div>
  <div class="config-general-grid">
    <label class="general-inline-field"><span id=tDeckSize></span><input id=deckSize type=number min=1 value=45 onchange="syncRaritiesToDeckSize()"></label>
    <label class="general-inline-field"><span id=tCopies></span><input id=maxCopies type=number min=1 value=1></label>
    <label class="general-inline-field"><span id=tDecks></span><input id=deckCount type=number min=1 max=20 value=1></label>
  </div>
  <div class="config-inventory-row"><div class="inventory-inline-wrap"><label class="inventory-inline"><input id=respectInv type=checkbox onchange="updateDeckCountHelp()"> <span id=tInventory></span></label><span id=tInventoryHelp class="small inventory-inline-help"></span><span id="deckCountHelp" class="field-help deck-count-help"></span></div></div>
</div>

<div class="config-section">
  <div class="config-section-title" data-en="Rarities" data-es="Rarezas">Rarities</div>
  <div class="rarity-config">
    <label class="ratio-preset-field"><span id=tRatioPreset></span><br><select id=ratioPreset onchange="applyRatioPreset(this.value)">
      <option value="base"></option><option value="commonHeavy"></option><option value="balancedRarity"></option><option value="rareHeavy"></option><option value="custom"></option>
    </select></label>
    <div class="rarity-counts">
      <label><span id=tC class="rarity-label"></span><input id=nC type=number min=0 value=23></label>
      <label><span id=tU class="rarity-label"></span><input id=nU type=number min=0 value=14></label>
      <label><span id=tR class="rarity-label"></span><input id=nR type=number min=0 value=6></label>
      <label><span id=tM class="rarity-label"></span><input id=nM type=number min=0 value=2></label>
    </div>
  </div>
</div>

<div class="config-section">
  <div class="config-section-title" data-en="Colors" data-es="Colores">Colors</div>
  <div class="color-top-grid">
    <label><span id=tMode></span><br><select id=mode><option value=balanced>Equilibrado automático</option><option value=free>Colores libres</option><option value=manual>Distribución manual</option></select></label>
    <label><span id=tPreset></span><br><select id=preset onchange="applyPreset(this.value)">
      <option value="">—</option><option value=standard></option><option value=priority></option><option value=twoColor></option><option value=threeColor></option><option value=manual></option>
    </select></label>
    <label><span id=tPriorityMode></span><br><select id=priorityMode onchange="updatePriorityUI()"><option value=random></option><option value=fixed></option></select></label>
  </div>
  <div id=priorityControls class="priority-compact">
    <label>1° <select id=prio1></select></label><label>2° <select id=prio2></select></label><label>3° <select id=prio3></select></label><label>4° <select id=prio4></select></label><label>5° <select id=prio5></select></label>
  </div>
  <div id=manual style="display:none"><h3 id=tManual></h3><table><tr><th></th><th>⚪</th><th>🔵</th><th>⚫</th><th>🔴</th><th>🟢</th></tr><tbody id=manualBody></tbody></table></div>
</div>

<div class="config-section seed-section">
  <div class="config-section-title" data-en="Seed" data-es="Seed">Seed</div>
  <div class="config-generate-actions">
    <div class="seed-row"><input id="seedInput" type="text" maxlength="64" placeholder="MSW-A7K42" autocomplete="off" spellcheck="false"><button type="button" onclick="copySeed()" id="copySeedBtn">⧉ Copiar</button><button type="button" onclick="pasteSeed()" id="pasteSeedBtn">▣ Pegar</button><button type="button" onclick="newSeed()" id="newSeedBtn">↻ Nueva seed</button><button type="button" class="secondary" onclick="generateWithSeed()" id="generateSeedBtn">Generar con seed</button><span id="seedStatus" class="small"></span></div>
  </div>
</div>

<div class="config-primary-actions">
  <button onclick="generateNew()" id="tGenerate"></button>
  <button class="secondary" onclick="reroll()" id="tReroll"></button>
  <div id="generateHelp" class="small action-help"></div>
</div>
</div>
<div class="toolbar deck-actions">
<div class="action-row collection-row">
  
  
</div>

<div id="section-decks" class="section-anchor"></div><input id="jsonImportInput" type="file" accept=".json,application/json" style="display:none" onchange="importDeckJSON(this.files[0],pendingJSONImportDeckIndex);this.value='';pendingJSONImportDeckIndex=null">
<div id=status style="display:none"></div><div id=decks></div>
<div id="drawerOverlay" class="drawer-overlay" onclick="closeAllDrawers()"></div>
<aside id="collectionDrawer" class="collection-drawer">
  <div class="drawer-head"><h2 id="drawerTitle"></h2><div class="drawer-head-actions"><button type="button" class="secondary collection-io-btn" id="collectionExportBtn" onclick="exportCollection()">Export JSON</button><button type="button" class="secondary collection-io-btn" id="collectionImportBtn" onclick="document.getElementById('collectionImportInput').click()">Import JSON</button><button type="button" class="collection-io-btn collection-reset-btn" id="collectionResetBtn" onclick="resetCollection()">Reset</button><input id="collectionImportInput" type="file" accept=".json,application/json" style="display:none" onchange="importCollection(this.files[0]);this.value=''"></div><button class="drawer-close" onclick="closeCollection()">×</button></div>
  <div class="drawer-tools">
    <input id="collectionSearch" type="search" oninput="renderCollection()" placeholder="">
    <div class="collection-filters">
      <select id="collectionOwnershipFilter" onchange="renderCollection()">
        <option value="all">Todas</option><option value="owned">Tengo</option><option value="missing">Faltantes</option>
      </select>
      <select id="collectionColorFilter" onchange="renderCollection()">
        <option value="all">Todos los colores</option>
        <option value="White">Blanco</option><option value="Blue">Azul</option><option value="Black">Negro</option><option value="Red">Rojo</option><option value="Green">Verde</option>
      </select>
      <select id="collectionRarityFilter" onchange="renderCollection()">
        <option value="all">Todas las rarezas</option><option value="C">Común</option><option value="U">Infrecuente</option><option value="R">Rara</option><option value="M">Mítica</option>
      </select>
      <button type="button" class="secondary collection-missing-filter" id="collectionMissingBtn" onclick="showMissingCollection()">Faltantes</button>
      <button type="button" class="secondary collection-clear-filter" id="collectionClearFilters" onclick="clearCollectionFilters()">Limpiar</button>
    </div>
  </div>
  <div id="collectionStats" class="collection-stats-panel"></div>
  <div id="collection" class="drawer-body"></div>
</aside>
</div><aside id="historyDrawer" class="collection-drawer">
  <div class="drawer-head"><h2 id="historyDrawerTitle"></h2><button class="drawer-close" onclick="closeHistory()">×</button></div>
  <div class="history-toolbar">
    <input id="historySearch" type="search" oninput="renderHistoryList()" placeholder="Buscar mazos">
    <select id="historySort" onchange="renderHistoryList()">
      <option value="newest">Más recientes</option>
      <option value="oldest">Más antiguos</option>
      <option value="name">Nombre A–Z</option>
    </select>
  </div>
  <div id="historyList" class="drawer-body"></div>
</aside><div id="swapOverlay" class="swap-overlay" onclick="if(event.target===this)closeSwapModal()"><div class="swap-modal"><div class=row style="justify-content:space-between"><h2 id="swapTitle"></h2><button class="drawer-close" onclick="closeSwapModal()">×</button></div><div id="swapBody"></div></div></div><div id="noteOverlay" class="swap-overlay" onclick="if(event.target===this)closeNoteModal()"><div class="note-modal"><div class="row" style="justify-content:space-between"><h2 id="noteTitle"></h2><button class="drawer-close" onclick="closeNoteModal()">×</button></div><div class="note-nav-row"><button type="button" id="noteBackBtn" class="note-back-btn" onclick="noteNavigateBack()">← Volver</button><span class="note-ref-hint" id="noteRefHint"></span></div><div id="noteBody"></div></div></div><div id="refCardPreview" aria-hidden="true"><img id="refCardPreviewImg" alt=""><div id="refCardPreviewCaption" class="ref-caption"></div></div><div id="cardPreview" class="card-preview" aria-hidden="true">
  <div class="preview-scroll">
    <img id="cardPreviewImg" alt="">
    <div id="cardPreviewCaption" class="card-preview-caption"></div>
    <div id="cardPreviewMeta" class="card-preview-meta"></div>
  </div>
</div><div id="stickyActions" class="sticky-actions" style="display:none">
  <span id="stickySeed" class="sticky-seed"></span>
  <span id="stickyCount" class="sticky-count"></span>
  <button onclick="generateNew()" id="stickyGenerate" class="sticky-generate"></button>
  <button onclick="reroll()" id="stickyReroll" class="secondary sticky-reroll"></button>
</div>
<script src="data/cards.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/generator.js"></script>
<script src="js/collection.js"></script>
<script src="js/history.js"></script>
<script src="js/json.js"></script>
<script src="js/cardPreview.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
</body></html>
