function cycleSort(tableId,col){

  let inDeck=new Set(decks[deckIndex].filter(x=>x.n!==cardNumber).map(x=>x.n));
  let candidates=cards.filter(x=>x.n!==cardNumber&&x.rarity===current.rarity);
  let entries=candidates.map(x=>({card:x,state:swapCandidateState(x,current,deckIndex,cardNumber,used,inDeck)}));
  let validCount=entries.filter(e=>e.state.valid).length;
  let same=entries.filter(e=>e.card.color===current.color).sort((a,b)=>a.card.n-b.card.n);
  let otherGroups=colors.filter(c=>c!==current.color).map(c=>({
    color:c,entries:entries.filter(e=>e.card.color===c).sort((a,b)=>a.card.n-b.card.n)
  })).filter(g=>g.entries.length);

  document.getElementById("swapTitle").textContent=`${T("replaceCard")}: ${current.name}`;
  let sameHtml=`<h3>${colorIcon(current.color)} ${T("sameColor")} — ${label(current.color)}</h3>`+
    (same.length?same.map(e=>swapOptionHtml(e.card,e.state)).join(""):`<p class=small>${language==="es"?"No hay cartas de esta rareza y color.":"No cards with this rarity and color."}</p>`);
  let otherHtml=`<hr><h3>${T("otherColors")}</h3><p class="small">⚠️ ${T("colorRuleWarning")}</p>`+
    (otherGroups.length?otherGroups.map(g=>`<h3>${colorIcon(g.color)} ${label(g.color)}</h3>${g.entries.map(e=>swapOptionHtml(e.card,e.state)).join("")}`).join("")
    :`<p class=small>${language==="es"?"No hay cartas de otros colores con esta rareza.":"No other-color cards with this rarity."}</p>`);

  document.getElementById("swapBody").innerHTML=
    `<p class="small">${colorIcon(current.color)} ${label(current.color)} · ${current.rarity} — ${T("availableReplacements")}: ${validCount}</p>`+
    sameHtml+otherHtml;
  document.getElementById("swapOverlay").classList.add("open");
}

function diceDisplay(c){
  if(!c)return "";
  let base=c.dice_value!=null?c.dice_value:"";
  let secondary=c.secondary_dice_value!=null?` → ${c.secondary_dice_value}`:"";

function decodeMoodHtml(text){
  let el=document.createElement("textarea");el.innerHTML=text||"";return el.value;
}
function stripMoodHtml(text){
  let el=document.createElement("div");el.innerHTML=decodeMoodHtml(renderMoodDiceNotation(text||""));return el.textContent||el.innerText||"";
}

function renderMoodDiceNotation(text){
  if(!text)return "";
  // Consecutive bracketed integers represent dice/value components.
  // Example: [6][1] => 7, [3] => 3.
  return String(text).replace(/(?:\[\d+\])+/g, token=>{
    const nums=[...token.matchAll(/\[(\d+)\]/g)].map(m=>Number(m[1]));
    return String(nums.reduce((sum,n)=>sum+n,0));
  });
}
function safeMoodHtml(text){
  let raw=decodeMoodHtml(renderMoodDiceNotation(text||""));
  let tpl=document.createElement("template");tpl.innerHTML=raw;
  tpl.content.querySelectorAll("*").forEach(el=>{
    if(!["STRONG","B","EM","I","BR"].includes(el.tagName))el.replaceWith(document.createTextNode(el.textContent||""));
    else [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  });
  let html=tpl.innerHTML;
  // Turn references to other Mood Swings cards into hover/tap previews.
  if(typeof cards!=="undefined"){
    const currentNames=[...cards].sort((a,b)=>b.name.length-a.name.length);
    for(const c of currentNames){
      const escaped=c.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      const re=new RegExp("(^|[^A-Za-z])("+escaped+")(?=$|[^A-Za-z])","gi");
      html=html.replace(re,(m,prefix,name)=>`${prefix}<span class="card-ref-preview" data-ref-card="${c.n}">${name}</span>`);
    }
  }
  return html;
}

function historyDeckInventoryStatus(deck){
  const counts={};
  (deck?.cards||[]).forEach(n=>{counts[+n]=(counts[+n]||0)+1});

    const card=cards.find(x=>x.n===+n),have=card?Math.max(0,+card.qty||0):0;
    return {card,need,have,missing:Math.max(0,need-have)};
  }).filter(x=>x.missing>0);
  return {valid:issues.length===0,issues,missingCopies:issues.reduce((a,x)=>a+x.missing,0)};
}
function historyGenerationInventoryStatus(entry){
  const counts={};
  (entry?.decks||[]).forEach(deck=>(deck?.cards||[]).forEach(n=>{counts[+n]=(counts[+n]||0)+1}));
  const issues=Object.entries(counts).map(([n,need])=>{

    return {card,need,have,missing:Math.max(0,need-have)};
  }).filter(x=>x.missing>0).sort((a,b)=>b.missing-a.missing||((a.card?.n||0)-(b.card?.n||0)));

function normalizeDeckJSON(data){
  if(!data || data.format!=="MoodSwingsDeckGenerator")throw new Error(language==="es"?"Formato JSON no reconocido.":"Unrecognized JSON format.");
  const version=Number(data.version||1);
  if(version>2)throw new Error(language==="es"?`Este JSON usa una versión más nueva (${version}) que esta aplicación no reconoce.`:`This JSON uses a newer version (${version}) that this app does not recognize.`);
  if(version<1)throw new Error(language==="es"?"Versión JSON no válida.":"Invalid JSON version.");
  if(!Array.isArray(data.decks)||!data.decks.length)throw new Error(language==="es"?"El JSON no contiene mazos.":"JSON contains no decks.");

  // v1 -> v2 migration is intentionally non-destructive: v1 already contains
  // the deck state/configuration we need, so only metadata defaults are added.
  const normalized={...data,version:2,schema:data.schema||"deck-state"};
  normalized.configuration={...(data.configuration||{})};
  if(normalized.configuration.deckCount==null)normalized.configuration.deckCount=data.sourceDeckCount||data.decks.length;
  normalized.decks=data.decks.map((d,i)=>({
    name:d?.name||`${T("deck")} ${i+1}`,
    cards:Array.isArray(d?.cards)?d.cards:[]
  }));
  normalized.excludedCards=Array.isArray(data.excludedCards)?data.excludedCards:[];
  return normalized;
}
function importDeckJSON(file,targetDeckIndex=null){

    try{
      const rawData=JSON.parse(String(reader.result||""));
      const data=normalizeDeckJSON(rawData);

      // Validate every referenced card before changing current state.
      const restoredDecks=data.decks.map(d=>{
        if(!d || !Array.isArray(d.cards))throw new Error(language==="es"?"Un mazo no contiene una lista de cartas válida.":"A deck has an invalid card list.");
        return d.cards.map(ref=>{
          const n=+(typeof ref==="object"?ref.number:ref);
          const card=cards.find(x=>x.n===n);
          if(!card)throw new Error((language==="es"?"Carta desconocida #":"Unknown card #")+n);
          return card;
        });
      });

      // Validate the resulting simultaneous set against the physical collection.
      // A single-deck import replaces only the clicked slot for this check.
      let candidateDecks;
      if(targetDeckIndex!==null && restoredDecks.length===1 && decks[targetDeckIndex]){
        candidateDecks=decks.map((d,i)=>i===targetDeckIndex?restoredDecks[0]:d);
      }else{
        candidateDecks=restoredDecks;
      }
      if(respectInv.checked){
        const inventoryIssues=simultaneousDeckInventoryIssues(candidateDecks);
        if(inventoryIssues.length){
          throw new Error((language==="es"
            ?"La importación haría que los mazos no puedan construirse simultáneamente con tu colección:\n"
            :"The import would make the decks impossible to build simultaneously with your collection:\n")
            +simultaneousDeckInventoryMessage(inventoryIssues));
        }
      }

      // Restore configuration saved by v53.
      const c=data.configuration||{};
      if(c.deckSize!=null)deckSize.value=c.deckSize;
      if(c.ratioPreset!=null)ratioPreset.value=c.ratioPreset;
      if(c.rarityCounts){
        if(c.rarityCounts.C!=null)nC.value=c.rarityCounts.C;
        if(c.rarityCounts.U!=null)nU.value=c.rarityCounts.U;
        if(c.rarityCounts.R!=null)nR.value=c.rarityCounts.R;
        if(c.rarityCounts.M!=null)nM.value=c.rarityCounts.M;
      }
      if(c.maxCopies!=null)maxCopies.value=c.maxCopies;
      if(c.deckCount!=null && targetDeckIndex!==null)deckCount.value=Math.max(1,+c.deckCount||1);
      if(c.mode!=null)mode.value=c.mode;
      if(c.preset!=null)preset.value=c.preset;
      if(c.respectInventory!=null)respectInv.checked=!!c.respectInventory;
      if(c.priorityMode!=null)priorityMode.value=c.priorityMode;
      if(Array.isArray(c.priority)){
        [prio1,prio2,prio3,prio4,prio5].forEach((el,i)=>{if(c.priority[i]!=null)el.value=c.priority[i]});
      }
      if(c.manualDistribution){
        rarities.forEach(r=>colors.forEach(col=>{
          const el=document.getElementById(`q${r}${col}`);
          if(el && c.manualDistribution[r] && c.manualDistribution[r][col]!=null)el.value=c.manualDistribution[r][col];
        }));
      }

      // Restore seed and exact deck state; do NOT call generate().
      activeGenerationSeed=String(data.seed||"").trim();
      const seedEl=document.getElementById("seedInput");
      if(seedEl)seedEl.value=activeGenerationSeed;

      if(targetDeckIndex!==null && restoredDecks.length===1 && decks[targetDeckIndex]){
        decks[targetDeckIndex]=restoredDecks[0];
        deckNames[targetDeckIndex]=data.decks[0].name||`${T("deck")} ${targetDeckIndex+1}`;
        Object.keys(locks).filter(k=>k.startsWith(targetDeckIndex+"-")).forEach(k=>delete locks[k]);
      }else{
        decks=restoredDecks;
        deckNames=data.decks.map((d,i)=>d.name||`${T("deck")} ${i+1}`);
        deckCount.value=decks.length;
        locks={};
      }

      if(Array.isArray(data.excludedCards)){
        excluded=new Set(data.excludedCards.map(Number));
        localStorage.setItem("msExcludedV3",JSON.stringify([...excluded]));
      }

      // Refresh dependent UI after all values are restored.
      updatePriorityUI();
      mode.onchange();
      render();
      const migrated=Number(rawData.version||1)<2;
      showToast((targetDeckIndex!==null&&restoredDecks.length===1?(language==="es"?"JSON importado ✓":"JSON imported ✓"):(language==="es"?"Mazos importados ✓":"Decks imported ✓"))+(migrated?(language==="es"?" · archivo actualizado":" · file migrated"):""));

    }catch(e){
      alert((language==="es"?"No se pudo importar el JSON. ":"Could not import JSON. ")+e.message);
    }
  };
  reader.readAsText(file,"UTF-8");
}

let configAutosaveTimer=null;
function saveConfigAuto(){
 try{
  const o={deckSize:deckSize.value,ratioPreset:ratioPreset.value,nC:nC.value,nU:nU.value,nR:nR.value,nM:nM.value,maxCopies:maxCopies.value,deckCount:deckCount.value,mode:mode.value,preset:preset.value,respectInv:respectInv.checked,priorityMode:priorityMode.value,prio1:prio1.value,prio2:prio2.value,prio3:prio3.value,prio4:prio4.value,prio5:prio5.value};
  rarities.forEach(r=>colors.forEach(c=>{const e=document.getElementById("q"+r+c);if(e)o["q"+r+c]=e.value}));
  localStorage.setItem("msConfigV3",JSON.stringify(o));
 }catch(e){}
}
function scheduleConfigAutosave(){clearTimeout(configAutosaveTimer);configAutosaveTimer=setTimeout(saveConfigAuto,120)}
function initConfigAutosave(){
 const ids=["deckSize","ratioPreset","nC","nU","nR","nM","maxCopies","deckCount","mode","preset","respectInv","priorityMode","prio1","prio2","prio3","prio4","prio5",...rarities.flatMap(r=>colors.map(c=>"q"+r+c))];
 ids.forEach(id=>{const e=document.getElementById(id);if(!e)return;e.addEventListener("change",scheduleConfigAutosave);e.addEventListener("input",scheduleConfigAutosave)});
}
function loadConfig(){let o=JSON.parse(localStorage.getItem("msConfigV3")||"{}");for(const k in o){let e=document.getElementById(k);if(e)e.type==="checkbox"?e.checked=o[k]:e.value=o[k]}if(!o.deckSize)deckSize.value=rarityTotal();if(!o.ratioPreset)ratioPreset.value="base";if(ratioPreset.value==="custom")customRatio=normalizeRatio(needs());mode.onchange();updatePriorityUI()}
setup();initPriorityPrevious();updatePriorityUI();initConfigAutosave();generate();

setTimeout(()=>{let e=document.getElementById("seedInput");if(e&&!e.value)newSeed()},0);
</script>
<script>
(function(){
  function initFloatingSectionNav(){
    const nav=document.querySelector(".app-section-nav");
    if(!nav || nav.dataset.floatingInit==="1")return;
    nav.dataset.floatingInit="1";
    const placeholder=document.createElement("div");
    placeholder.className="app-section-nav-placeholder";
    nav.parentNode.insertBefore(placeholder,nav.nextSibling);

    let triggerY=0;
    function measure(){
      const wasFloating=nav.classList.contains("nav-floating");
      if(wasFloating)nav.classList.remove("nav-floating");
      placeholder.classList.remove("active");
      const r=nav.getBoundingClientRect();
      triggerY=r.top+window.scrollY-6;
      placeholder.style.height=r.height+"px";
      if(wasFloating)update();
    }
    function updateActiveSection(){
      if(syncStructuralActiveFromUI())return;
      if(Date.now()<structuralNavLockUntil)return;
      const line=nav.classList.contains("nav-floating")?nav.getBoundingClientRect().bottom+14:90;
      const decksEl=document.getElementById("decks");
      const section=(decksEl&&decksEl.children.length&&decksEl.getBoundingClientRect().top<=line)?"decks":"generator";
      setStructuralActive(section);
    }
    function update(){
      if(window.scrollY>triggerY){
        const parentRect=nav.parentElement.getBoundingClientRect();
        const wrap=document.querySelector(".wrap")?.getBoundingClientRect();
        const left=wrap?wrap.left:parentRect.left;
        const maxWidth=wrap?wrap.width:parentRect.width;
        placeholder.style.height=nav.offsetHeight+"px";
        placeholder.classList.add("active");
        nav.classList.add("nav-floating");
        nav.style.left=left+"px";
        nav.style.width=Math.min(maxWidth,window.innerWidth-left-8)+"px";
      }else{
        nav.classList.remove("nav-floating");
        placeholder.classList.remove("active");
        nav.style.left="";
        nav.style.width="";
      }
      updateActiveSection();
    }
    window.addEventListener("scroll",update,{passive:true});
    window.addEventListener("resize",()=>{measure();update()});
    requestAnimationFrame(()=>{measure();update()});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initFloatingSectionNav);
  else initFloatingSectionNav();
})();
</script>
